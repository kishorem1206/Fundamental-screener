[project]
name = "fundamental-screener-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.0",
    "openpyxl>=3.1",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "reportlab>=4.0.0",
    "pdfplumber>=0.11.10",
    "pytesseract>=0.3.13",
    "jinja2>=3.1.6",
    "playwright>=1.62.0",
    "mcp>=1.2.0",
    "pyyaml>=6.0.0",
    "minio>=7.2.0",
    "xlrd>=2.0.2",
    "requests>=2.31",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
